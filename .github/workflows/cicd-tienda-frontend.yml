name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Build imagen Frontend (solo build, sin push)
      run: |
        cd frontend
        docker build -t tienda-frontend-image .

    - name: Enviar imagen a EC2 vía SSM para que ELLA haga el push y el deploy
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Build y deploy frontend desde EC2" \
          --parameters "commands=[
            'aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}',
            'docker build -t tienda-frontend-image /home/ec2-user/frontend',
            'docker tag tienda-frontend-image:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest',
            'docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest',
            'docker stop tienda-frontend || true',
            'docker rm tienda-frontend || true',
            'docker pull ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest',
            'docker run -d --name tienda-frontend -p 80:80 ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest'
          ]" \
          --region ${{ secrets.AWS_REGION }}
